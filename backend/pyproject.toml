
[project]
name = "bunbetsu-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=2.0.0",
    "networkx>=3.0",
    "scipy>=1.13.0",
    "pytest>=8.0.0",
]

[tool.vercel]
entrypoint = "server:app"
